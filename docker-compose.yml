services:
  varden:
    image: zzabek/varden:latest
    container_name: varden
    restart: unless-stopped
    ports:
      - "8080:8080"           # Web panel, API and WebSocket (HTTP)
      - "25565:25565"         # Minecraft Java: one shared port for every server (proxy by subdomain) + resource pack downloads
      - "24454:24454/udp"     # Simple Voice Chat: one shared UDP port for every server
      - "19132:19132/tcp"     # Bedrock Edition (Geyser): NetherNet signaling – players find the server here
      - "19132:19132/udp"     # Bedrock Edition (Geyser): gameplay traffic
    volumes:
      - varden-data:/data
      # Optional backup destination on a NAS / second disk – add it in Panel settings → Backup destinations:
      # - /mnt/nas/minecraft-backups:/backups/nas
      # Optional: native Linux kernel cgroup v2 CPU limits inside Docker (otherwise cpulimit is used automatically):
      # - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # cgroup: private  # uncomment with /sys/fs/cgroup:rw above if your Docker daemon defaults to host cgroupns
    environment:
      TZ: Europe/Warsaw
      PUID: "1000"
      PGID: "1000"
      # CurseForge API key (can also be set in the panel):
      # CURSEFORGE_API_KEY: ""
      # Set to "true" when the panel is served over HTTPS:
      VARDEN_SECURE_COOKIES: "false"
      # Behind a reverse proxy: its IP or network range, so the panel sees real client IPs:
      # VARDEN_TRUSTED_PROXIES: "172.16.0.0/12"
      # Optional: Bedrock gamertags allowed to keep a refreshed Microsoft login token.
      # VARDEN_BEDROCK_SAVED_LOGINS: "PlayerOne,PlayerTwo"
    # Gives servers time to save their worlds when the container stops
    stop_grace_period: 2m
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    # Container memory limit – shown next to the RAM sliders in the panel
    # deploy:
    #   resources:
    #     limits:
    #       memory: 16g

volumes:
  varden-data:
